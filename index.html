<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Pika</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; }
      canvas#game { display: block; width: 100%; height: 100%; touch-action: none; }

      /* The start screen is pictures only: no reading needed. */
      #start {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 3vh;
        background: linear-gradient(#bfe6ff, #e9f8e4);
      }
      #start[hidden] { display: none; }
      #space { width: min(86vw, 62vh * 1.54); height: auto; }

      #enter-vr {
        width: min(34vw, 24vh); aspect-ratio: 1; border: 0; border-radius: 50%;
        background: #ff8a3d; box-shadow: 0 10px 0 #c9601d; cursor: pointer;
        display: grid; place-items: center; padding: 0;
        transition: transform 80ms ease-out, box-shadow 80ms ease-out;
      }
      #enter-vr:active { transform: translateY(6px); box-shadow: 0 4px 0 #c9601d; }
      #enter-vr:focus-visible { outline: 6px solid #2b1500; outline-offset: 6px; }
      #enter-vr svg { width: 58%; height: 58%; }
      #enter-vr .icon { display: none; }
      #enter-vr[data-state='loading'] { background: #b7c2cc; box-shadow: 0 10px 0 #8794a0; cursor: progress; }
      #enter-vr[data-state='loading'] .loading { display: block; animation: spin 1.1s linear infinite; }
      #enter-vr[data-state='ready'] .ready { display: block; }
      #enter-vr[data-state='none'] { background: #b7c2cc; box-shadow: 0 10px 0 #8794a0; cursor: default; }
      #enter-vr[data-state='none'] .none { display: block; }
      /* Nobody signed in: a key, which opens the number pad. No connection: a crossed-out cloud, to try again. */
      #enter-vr[data-state='locked'], #enter-vr[data-state='locked']:active { background: #ffe08a; box-shadow: 0 10px 0 #d9b24a; }
      #enter-vr[data-state='locked'] .locked { display: block; }
      #enter-vr[data-state='offline'], #enter-vr[data-state='offline']:active { background: #e3e9ee; box-shadow: 0 10px 0 #b9c7d2; }
      #enter-vr[data-state='offline'] .offline { display: block; }
      /* The browser has still to ask about the microphone: a microphone. Pressing it brings the question up, before VR starts. */
      #enter-vr[data-state='microphone'], #enter-vr[data-state='microphone']:active { background: #9fe0b0; box-shadow: 0 10px 0 #5fae78; }
      #enter-vr[data-state='microphone'] .microphone { display: block; }
      /* The microphone is blocked for this site: a crossed-out microphone in the corner. Nobody will hear the player. */
      #no-microphone {
        position: absolute; top: 3vh; left: 3vh; width: min(15vw, 11vh); aspect-ratio: 1;
        border-radius: 50%; background: #fff; box-shadow: 0 0.8vh 0 #b9c7d2; display: grid; place-items: center;
      }
      #no-microphone[hidden] { display: none; }
      #no-microphone svg { width: 64%; height: 64%; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Sign in, to play: a button in the corner that opens a number pad. */
      #sign-in {
        position: absolute; top: 3vh; right: 3vh; width: min(15vw, 11vh); aspect-ratio: 1;
        border: 0; border-radius: 50%; background: #fff; box-shadow: 0 0.8vh 0 #b9c7d2;
        cursor: pointer; display: grid; place-items: center; padding: 0;
      }
      #sign-in:focus-visible, #pad-keys button:focus-visible { outline: 0.6vh solid #2b1500; outline-offset: 0.5vh; }
      #sign-in svg { width: 64%; height: 64%; display: none; }
      #sign-in[data-state='out'] .out, #sign-in[data-state='in'] .in { display: block; }
      #sign-in[data-state='in'] { background: #d8f5c8; box-shadow: 0 0.8vh 0 #8fc97a; }

      #pad {
        position: absolute; inset: 0; display: grid; place-items: center;
        background: rgba(32, 48, 64, 0.5);
      }
      #pad[hidden] { display: none; }
      #pad-card {
        background: #fff; border-radius: 4vh; padding: 3vh; display: grid; gap: 2vh;
        justify-items: center;
      }
      #pad-slots { display: flex; gap: 1.6vh; }
      #pad-slots span {
        width: 3.4vh; height: 3.4vh; border-radius: 50%; border: 0.5vh solid #39424e;
        box-sizing: border-box;
      }
      #pad-slots span.filled { background: #39424e; }
      #pad-note { height: 4.5vh; }
      #pad-note svg { height: 100%; display: none; }
      #pad-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6vh; }
      #pad-keys button {
        width: min(18vw, 11.5vh); aspect-ratio: 1; border: 0; border-radius: 28%;
        background: #ffe08a; box-shadow: 0 0.8vh 0 #d9b24a; color: #2b1500; cursor: pointer;
        font: 700 min(9vw, 5.6vh) / 1 system-ui, sans-serif;
        display: grid; place-items: center; padding: 0;
      }
      #pad-keys button:active { transform: translateY(0.5vh); box-shadow: 0 0.3vh 0 #d9b24a; }
      #pad-keys button[data-key='back'], #pad-keys button[data-key='close'] {
        background: #e3e9ee; box-shadow: 0 0.8vh 0 #b9c7d2;
      }
      #pad-keys svg { width: 52%; height: 52%; }
      /* A wrong code shakes the pad and turns the dots red. */
      #pad[data-problem] #pad-card { animation: shake 0.4s; }
      #pad[data-problem='bad-code'] #pad-slots span { border-color: #e0352b; background: #e0352b; }
      #pad[data-problem='slow-down'] .slow, #pad[data-problem='offline'] .offline { display: block; }
      @keyframes shake {
        20% { transform: translateX(-1.5vh); } 40% { transform: translateX(1.5vh); }
        60% { transform: translateX(-1vh); } 80% { transform: translateX(1vh); }
      }

      @media (prefers-reduced-motion: reduce) {
        #enter-vr[data-state='loading'] .loading { animation: none; }
        #enter-vr { transition: none; }
        #pad[data-problem] #pad-card { animation: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="start">
      <!-- Clear a space: arms spread wide inside an empty ring, furniture pushed out of it. -->
      <svg id="space" viewBox="0 0 400 260" role="img"
           aria-label="Clear a space around you. Flapping uses your full arm span.">
        <ellipse cx="200" cy="212" rx="150" ry="34" fill="#c9efb8" />
        <ellipse cx="200" cy="212" rx="150" ry="34" fill="none" stroke="#2fae4a"
                 stroke-width="5" stroke-dasharray="14 10" />

        <!-- The player, arms out like wings. -->
        <g stroke-linecap="round">
          <line x1="200" y1="128" x2="92" y2="118" stroke="#6e6a73" stroke-width="16" />
          <line x1="200" y1="128" x2="308" y2="118" stroke="#6e6a73" stroke-width="16" />
          <circle cx="92" cy="118" r="9" fill="#f4eedb" />
          <circle cx="308" cy="118" r="9" fill="#f4eedb" />
          <line x1="188" y1="170" x2="184" y2="212" stroke="#d9a6a0" stroke-width="12" />
          <line x1="212" y1="170" x2="216" y2="212" stroke="#d9a6a0" stroke-width="12" />
        </g>
        <ellipse cx="200" cy="146" rx="26" ry="36" fill="#f1dc6a" />
        <circle cx="200" cy="92" r="24" fill="#f8dc48" />
        <path d="M192 72 L203 34 L210 72 Z" fill="#f8dc48" />
        <rect x="178" y="82" width="44" height="18" rx="8" fill="#39424e" />
        <circle cx="181" cy="103" r="6" fill="#e9601a" />
        <circle cx="219" cy="103" r="6" fill="#e9601a" />

        <!-- Arm span. -->
        <g stroke="#2fae4a" stroke-width="5" stroke-linecap="round" fill="none">
          <line x1="84" y1="62" x2="316" y2="62" />
          <path d="M98 50 L84 62 L98 74" />
          <path d="M302 50 L316 62 L302 74" />
        </g>

        <!-- A sofa and a table, moved out of the ring. -->
        <g>
          <rect x="4" y="150" width="46" height="34" rx="9" fill="#9b7bea" />
          <rect x="0" y="170" width="54" height="26" rx="9" fill="#7a5bd6" />
          <rect x="350" y="160" width="46" height="9" rx="4" fill="#c98a4b" />
          <rect x="356" y="169" width="7" height="30" fill="#9a6b3f" />
          <rect x="383" y="169" width="7" height="30" fill="#9a6b3f" />
        </g>
        <g stroke="#ff7a1a" stroke-width="6" stroke-linecap="round" fill="none">
          <line x1="76" y1="232" x2="44" y2="232" />
          <path d="M56 222 L44 232 L56 242" />
          <line x1="324" y1="232" x2="356" y2="232" />
          <path d="M344 222 L356 232 L344 242" />
        </g>
      </svg>

      <button id="enter-vr" data-state="loading" disabled aria-label="Loading">
        <svg class="icon loading" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="17" fill="none" stroke="#2b3640" stroke-width="6"
                  stroke-linecap="round" stroke-dasharray="70 40" />
        </svg>
        <svg class="icon ready" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M17 10 L39 24 L17 38 Z" fill="#2b1500" stroke="#2b1500" stroke-width="4" stroke-linejoin="round" />
        </svg>
        <svg class="icon none" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="7" y="16" width="34" height="18" rx="7" fill="none" stroke="#2b3640" stroke-width="5" />
          <line x1="8" y1="40" x2="40" y2="8" stroke="#2b3640" stroke-width="5" stroke-linecap="round" />
        </svg>
        <svg class="icon locked" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="16" cy="24" r="9" fill="none" stroke="#2b1500" stroke-width="6" />
          <path d="M25 24 H43 M36 24 V33 M43 24 V31" fill="none" stroke="#2b1500" stroke-width="6" stroke-linecap="round" />
        </svg>
        <svg class="icon offline" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M14 34 H34 A8 8 0 0 0 35 18 A11 11 0 0 0 14 20 A7 7 0 0 0 14 34 Z"
                fill="none" stroke="#39424e" stroke-width="5" stroke-linejoin="round" />
          <path d="M8 42 L40 8" stroke="#e0352b" stroke-width="5" stroke-linecap="round" />
        </svg>
        <svg class="icon microphone" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="18" y="6" width="12" height="22" rx="6" fill="#16323a" />
          <path d="M12 22 A12 12 0 0 0 36 22 M24 34 V42 M16 42 H32" fill="none" stroke="#16323a" stroke-width="5" stroke-linecap="round" />
        </svg>
      </button>

      <!-- The microphone is blocked for this site. For the grown-up: allow it in the browser's settings for this site, then reload. -->
      <div id="no-microphone" role="img" hidden
           aria-label="The microphone is blocked for this site, so nobody in the game can hear you. Allow it in the browser's settings for this site, then reload."
           title="The microphone is blocked for this site, so nobody in the game can hear you. Allow it in the browser's settings for this site, then reload.">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="18" y="6" width="12" height="22" rx="6" fill="#39424e" />
          <path d="M12 22 A12 12 0 0 0 36 22 M24 34 V42 M16 42 H32" fill="none" stroke="#39424e" stroke-width="5" stroke-linecap="round" />
          <path d="M8 42 L40 8" stroke="#e0352b" stroke-width="5" stroke-linecap="round" />
        </svg>
      </div>

      <!-- Sign in: a key when nobody is signed in, a parrot with a tick when somebody is. -->
      <button id="sign-in" data-state="out" aria-label="Sign in">
        <svg class="out" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="16" cy="24" r="9" fill="none" stroke="#39424e" stroke-width="6" />
          <path d="M25 24 H43 M36 24 V33 M43 24 V31" fill="none" stroke="#39424e" stroke-width="6" stroke-linecap="round" />
        </svg>
        <svg class="in" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M20 12 L25 1 L29 12 Z" fill="#f8dc48" />
          <circle cx="24" cy="24" r="14" fill="#f8dc48" />
          <circle cx="17" cy="21" r="2.4" fill="#16121a" />
          <circle cx="31" cy="21" r="2.4" fill="#16121a" />
          <circle cx="13" cy="28" r="3.6" fill="#e9601a" />
          <circle cx="35" cy="28" r="3.6" fill="#e9601a" />
          <path d="M20 25 Q24 22 28 25 L24 33 Z" fill="#cdb3b6" />
          <circle cx="38" cy="38" r="9" fill="#2fae4a" />
          <path d="M33.5 38 L37 41.5 L43 35" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <!-- The number pad for the 6-digit code. The sixth digit sends it. -->
      <div id="pad" role="dialog" aria-label="Type your 6-digit code" hidden>
        <div id="pad-card">
          <div id="pad-slots" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div id="pad-note" aria-hidden="true">
            <!-- Too many tries: wait a little. -->
            <svg class="slow" viewBox="0 0 48 48">
              <path d="M12 6 H36 M12 42 H36 M15 6 C15 28 33 28 33 6 M15 42 C15 20 33 20 33 42"
                    fill="none" stroke="#39424e" stroke-width="5" stroke-linecap="round" />
            </svg>
            <!-- No connection. -->
            <svg class="offline" viewBox="0 0 48 48">
              <path d="M14 34 H34 A8 8 0 0 0 35 18 A11 11 0 0 0 14 20 A7 7 0 0 0 14 34 Z"
                    fill="none" stroke="#39424e" stroke-width="5" stroke-linejoin="round" />
              <path d="M8 42 L40 8" stroke="#e0352b" stroke-width="5" stroke-linecap="round" />
            </svg>
          </div>
          <div id="pad-keys">
            <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
            <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
            <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
            <button data-key="back" aria-label="Rub out">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path d="M18 10 H42 V38 H18 L6 24 Z" fill="none" stroke="#39424e" stroke-width="5" stroke-linejoin="round" />
                <path d="M24 18 L34 30 M34 18 L24 30" stroke="#39424e" stroke-width="5" stroke-linecap="round" />
              </svg>
            </button>
            <button data-key="0">0</button>
            <button data-key="close" aria-label="Close">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path d="M12 12 L36 36 M36 12 L12 36" stroke="#39424e" stroke-width="6" stroke-linecap="round" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
